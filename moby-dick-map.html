<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moby Dick — The Spirit-Spout: Voyage Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: #0a1628;
      color: #e8d5b0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #0d2137 0%, #1a3a5c 50%, #0d2137 100%);
      border-bottom: 2px solid #8b6914;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .whale-icon { font-size: 2.2rem; }

    .header-text h1 {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      color: #f0d080;
      text-transform: uppercase;
    }

    .header-text p {
      font-size: 0.78rem;
      color: #a0b8d0;
      letter-spacing: 0.08em;
      margin-top: 2px;
      font-style: italic;
    }

    .quote-banner {
      background: rgba(139, 105, 20, 0.15);
      border-left: 3px solid #8b6914;
      padding: 8px 24px;
      font-size: 0.82rem;
      font-style: italic;
      color: #c8b882;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(139,105,20,0.3);
    }

    #map {
      flex: 1;
      z-index: 1;
    }

    /* Custom Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      background: #0d2137;
      border: 1px solid #8b6914;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.7);
      color: #e8d5b0;
      font-family: 'Georgia', serif;
    }

    .leaflet-popup-tip {
      background: #8b6914;
    }

    .leaflet-popup-close-button {
      color: #f0d080 !important;
      font-size: 18px !important;
    }

    .popup-content { padding: 4px 6px; min-width: 220px; }

    .popup-content .stop-number {
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8b6914;
      margin-bottom: 4px;
    }

    .popup-content h3 {
      font-size: 1.05rem;
      color: #f0d080;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(139,105,20,0.4);
      padding-bottom: 5px;
    }

    .popup-content .coords {
      font-size: 0.7rem;
      color: #7090a8;
      margin-bottom: 8px;
      font-style: italic;
    }

    .popup-content .description {
      font-size: 0.82rem;
      line-height: 1.55;
      color: #c8b882;
      margin-bottom: 8px;
    }

    .popup-content .novel-quote {
      background: rgba(139, 105, 20, 0.1);
      border-left: 2px solid #8b6914;
      padding: 6px 8px;
      font-size: 0.75rem;
      font-style: italic;
      color: #a8987a;
      line-height: 1.5;
    }

    /* Voyage path animation */
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 30px;
      right: 10px;
      z-index: 1000;
      background: rgba(13, 33, 55, 0.92);
      border: 1px solid #8b6914;
      border-radius: 4px;
      padding: 12px 16px;
      font-size: 0.75rem;
      color: #c8b882;
      min-width: 180px;
    }

    .legend h4 {
      color: #f0d080;
      margin-bottom: 8px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(139,105,20,0.4);
      padding-bottom: 5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-line {
      width: 30px;
      height: 2px;
      background: repeating-linear-gradient(
        to right,
        #f0a030 0, #f0a030 6px,
        transparent 6px, transparent 12px
      );
      flex-shrink: 0;
    }

    .stop-count {
      background: rgba(139,105,20,0.2);
      border: 1px solid #8b6914;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.7rem;
      color: #f0d080;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="whale-icon">🐋</div>
    <div class="header-text">
      <h1>Moby Dick — The Spirit-Spout</h1>
      <p>Chapter 51 &nbsp;·&nbsp; Voyage of the Pequod &nbsp;·&nbsp; Herman Melville, 1851</p>
    </div>
  </header>

  <div class="quote-banner">
    "Days, weeks passed, and under easy sail, the ivory Pequod had slowly swept across four several cruising-grounds..."
  </div>

  <div id="map"></div>

  <div class="legend">
    <h4>Map Legend</h4>
    <div class="legend-item">
      <div class="legend-dot" style="background:#f0d080; border: 2px solid #8b6914;"></div>
      Named Location
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#a06020; border: 2px dashed #f0d080;"></div>
      Approximate / Unnamed
    </div>
    <div class="legend-item">
      <div class="legend-line"></div>
      Pequod's Route
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ── Map init with dark ocean tiles ──────────────────────────────────────
    const map = L.map('map', {
      center: [10, -20],
      zoom: 3,
      minZoom: 2,
      maxZoom: 10,
    });

    // CartoDB Dark Matter — clean dark ocean look, no API key needed
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // ── Location data ────────────────────────────────────────────────────────
    const locations = [
      {
        id: 1,
        name: "The Azores",
        coords: [38.5, -28.0],
        exact: true,
        color: "#f0d080",
        description: "An archipelago of nine volcanic islands in the North Atlantic, belonging to Portugal. A major waypoint for trans-Atlantic voyagers since the Age of Exploration.",
        quote: "\"...that off the Azores...\"",
        context: "First cruising-ground of the Pequod's southward voyage."
      },
      {
        id: 2,
        name: "Cape Verde Islands",
        coords: [15.1, -23.6],
        exact: true,
        color: "#f0d080",
        description: "An island nation off West Africa's coast. Whalers frequently stopped here to take on water and provisions before plunging south into the Atlantic.",
        quote: "\"...off the Cape de Verdes...\"",
        context: "Second cruising-ground — rich sperm whale feeding waters."
      },
      {
        id: 3,
        name: "Rio de la Plata (The Plate)",
        coords: [-34.6, -55.5],
        exact: true,
        color: "#f0d080",
        description: "The wide estuary between Argentina and Uruguay, one of the world's broadest river mouths. Melville calls it 'The Plate', a translation from the Spanish Río de la Plata.",
        quote: "\"...on the Plate (so called), being off the mouth of the Rio de la Plata...\"",
        context: "Third cruising-ground — South American waters."
      },
      {
        id: 4,
        name: "St. Helena",
        coords: [-15.97, -5.71],
        exact: true,
        color: "#f0d080",
        description: "A remote British island in the South Atlantic, famous as Napoleon's final exile. A vital resupply stop on the old East India trade route.",
        quote: "\"...southerly from St Helena.\"",
        context: "Reference point for the Carrol Ground's location."
      },
      {
        id: 5,
        name: "The Carrol Ground",
        coords: [-28.0, -3.0],
        exact: false,
        color: "#c07830",
        description: "An 'unstaked, watery locality' — Melville's own term for this unmarked stretch of South Atlantic ocean south of St. Helena. No fixed coordinates exist; it was known only to whalers by tradition.",
        quote: "\"...the Carrol Ground, an unstaked, watery locality, southerly from St Helena.\"",
        context: "Fourth and final cruising-ground mentioned in this chapter — where the Spirit-Spout was sighted."
      }
    ];

    // ── Custom marker factory ────────────────────────────────────────────────
    function makeIcon(loc) {
      const border = loc.exact ? `3px solid ${loc.color}` : `2px dashed ${loc.color}`;
      const bg = loc.exact ? loc.color : '#1a3a5c';
      const html = `
        <div style="
          width: 32px; height: 32px;
          background: ${bg};
          border: ${border};
          border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 13px; font-weight: bold; color: #0d2137;
          box-shadow: 0 0 12px rgba(240,208,128,0.5), 0 2px 8px rgba(0,0,0,0.6);
          font-family: Georgia, serif;
        ">${loc.id}</div>`;
      return L.divIcon({ html, className: '', iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -20] });
    }

    // ── Draw voyage path ─────────────────────────────────────────────────────
    // Route order: Azores → Cape Verde → Rio de la Plata → (back across) → Carrol Ground → St Helena ref
    const routeCoords = [
      [38.5, -28.0],   // Azores
      [15.1, -23.6],   // Cape Verde
      [-34.6, -55.5],  // Rio de la Plata
      [-28.0, -3.0],   // Carrol Ground
      [-15.97, -5.71], // St Helena
    ];

    const polyline = L.polyline(routeCoords, {
      color: '#f0a030',
      weight: 2,
      opacity: 0.7,
      dashArray: '8, 8',
    }).addTo(map);

    // ── Place markers with popups ────────────────────────────────────────────
    locations.forEach(loc => {
      const marker = L.marker(loc.coords, { icon: makeIcon(loc) }).addTo(map);

      const exactBadge = loc.exact
        ? `<span style="color:#4caf50; font-size:0.7rem;">✓ Named location</span>`
        : `<span style="color:#ff9800; font-size:0.7rem;">~ Approximate — "unstaked"</span>`;

      const popupHtml = `
        <div class="popup-content">
          <div class="stop-number">Stop ${loc.id} of ${locations.length}</div>
          <h3>${loc.name}</h3>
          <div class="coords">
            ${Math.abs(loc.coords[0]).toFixed(2)}° ${loc.coords[0] >= 0 ? 'N' : 'S'},
            ${Math.abs(loc.coords[1]).toFixed(2)}° ${loc.coords[1] >= 0 ? 'E' : 'W'}
            &nbsp;·&nbsp; ${exactBadge}
          </div>
          <div class="description">${loc.description}</div>
          <div class="novel-quote">
            <strong style="color:#f0d080; font-style:normal;">From Chapter 51:</strong><br/>
            ${loc.quote}<br/>
            <span style="color:#8b6914; margin-top:4px; display:block;">${loc.context}</span>
          </div>
        </div>`;

      marker.bindPopup(popupHtml, { maxWidth: 300 });

      // Pulse animation on hover
      marker.on('mouseover', function() { this.openPopup(); });
    });

    // Fit map to show all markers with padding
    map.fitBounds(polyline.getBounds(), { padding: [60, 60] });

    // ── Animate route drawing ────────────────────────────────────────────────
    // Re-draw route with a sequential animation effect
    let step = 0;
    const total = routeCoords.length;
    const animatedLine = L.polyline([], {
      color: '#f0e060',
      weight: 3,
      opacity: 0.9,
      dashArray: '6, 6',
    }).addTo(map);

    function animateRoute() {
      if (step < total) {
        animatedLine.addLatLng(routeCoords[step]);
        step++;
        setTimeout(animateRoute, 600);
      } else {
        // Fade to the static dashed line
        setTimeout(() => {
          map.removeLayer(animatedLine);
        }, 1000);
      }
    }

    setTimeout(animateRoute, 800);
  </script>
</body>
</html>
